name: Verify logistics planner
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: planner_test
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: local_ci_test_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U planner -d planner_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_TEST_URL: postgresql+psycopg://planner:local_ci_test_only@127.0.0.1:5432/planner_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: python -m pip install -r requirements-planner.lock.txt
      - run: npm ci
      - run: npm run check
      - run: npm run build:ui
      - run: npm test
      - name: Build and smoke-test Docker deployment
        run: |
          docker build -t logistics-planner:ci .
          docker run -d --name planner-ci -p 127.0.0.1:18080:10000 -e PORT=10000 -e PLANNER_API_TOKEN=container-smoke-test-only logistics-planner:ci
          python - <<'PYTHON'
          import time
          import httpx
          with httpx.Client(base_url="http://127.0.0.1:18080", trust_env=False) as client:
              for attempt in range(120):
                  try:
                      if client.get("/api/health").status_code == 200:
                          break
                  except httpx.TransportError:
                      pass
                  time.sleep(0.5)
              else:
                  raise SystemExit("Docker container did not become healthy")
              assert client.get("/").status_code == 200
              assert client.get("/api/scenarios").status_code == 401
              assert client.get("/api/demo").json()["data"]["result"]["execution"]["verified"]
              assert client.get("/api/demo/export.csv").status_code == 200
              authorized = client.get("/api/scenarios", headers={"Authorization": "Bearer container-smoke-test-only"})
              assert authorized.status_code == 200 and authorized.json()["data"]
          PYTHON
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs planner-ci || true
          docker rm -f planner-ci || true
