name: Verify logistics planner
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: planner_test
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: local_ci_test_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U planner -d planner_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_TEST_URL: postgresql+psycopg://planner:local_ci_test_only@127.0.0.1:5432/planner_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: python -m pip install -r requirements-planner.lock.txt
      - run: npm ci
      - run: npm run check
      - run: npm run build:ui
      - run: npm test
