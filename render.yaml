# Demo-only Free resources. Render Free Postgres expires after 30 days.
# No paid resources are requested by this blueprint.
services:
  - type: web
    name: erivan-logistics-intelligence
    runtime: docker
    repo: https://github.com/Erivan011/Logistics-solution
    branch: main
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: erivan-logistics-demo-db
          property: connectionString
      - key: PLANNER_API_TOKEN
        generateValue: true

databases:
  - name: erivan-logistics-demo-db
    plan: free
    region: oregon
    databaseName: erivan_logistics_demo_db
    user: erivan_logistics_demo_db_user
    ipAllowList: []
